<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salt Road Cinema | Car films from Bonaire</title>
<meta name="description" content="Salt Road Cinema makes car and tuning films on Bonaire. Builds, night runs, meets and the island's car scene.">
<meta name="robots" content="noindex">
<link href="fonts/site-fonts.css" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/css/home.css">
</head>
<body data-page="home">
<div data-shell="nav"></div>

<header class="hero letterbox">
  <!-- Hero media comes from SRC.heroVideo / SRC.heroImage in assets/config.js -->
  <div class="hero-bg" data-bg="hero"></div>
  <video class="hero-video" muted loop playsinline preload="none" hidden></video>
  <div class="hero-shade"></div>
  <div class="timecode"><b></b>REC <span id="tc">00:00:00:00</span> · 12.15°N 68.27°W</div>
  <div class="wrap">
    <h1 data-i18n-html="home.h1"></h1>
    <p class="lead" data-i18n="home.lead"></p>
    <div class="ctas">
      <a class="btn btn-salt" data-yt target="_blank" rel="noopener"><span data-i18n="home.cta.yt"></span> ▸</a>
      <a class="btn btn-ghost" href="garage.html" data-i18n="home.cta.garage"></a>
    </div>
  </div>
</header>

<section class="reel-sec"><div class="wrap reel-grid">
  <div class="reveal">
    <h2 data-i18n-html="home.reel.h"></h2>
    <p class="sub" data-i18n="home.reel.sub"></p>
    <p class="credit">Footage <a href="https://www.instagram.com/keanupanu/" target="_blank" rel="noopener">@keanupanu</a> · <a href="https://www.instagram.com/rnsxnce/" target="_blank" rel="noopener">@rnsxnce</a></p>
  </div>
  <div class="reel-video reveal">
    <video src="media/reel-drift.mp4" poster="media/drift-crowd.jpg" controls playsinline preload="none"></video>
  </div>
</div></section>

<section id="films-sec"><div class="wrap">
  <div class="head reveal">
    <div><h2 data-i18n-html="home.films.h"></h2><p class="sub" data-i18n="home.films.sub"></p></div>
    <a class="btn btn-ghost" href="films.html" data-i18n="common.more"></a>
  </div>
  <div id="reel" class="reel reveal"></div>
  <div id="series" class="series reveal"></div>
</div></section>

<section><div class="wrap">
  <div class="head reveal">
    <div><h2 data-i18n-html="home.garage.h"></h2><p class="sub" data-i18n="home.garage.sub"></p></div>
    <a class="btn btn-ghost" href="garage.html" data-i18n="common.more"></a>
  </div>
  <a class="subi-band reveal" href="subi.html">
    <div class="car-frame" data-car></div>
    <div>
      <h3 data-i18n="home.subi.title"></h3>
      <p data-i18n="home.subi.text"></p>
      <div class="meter"><div class="bar"><div class="fill"></div></div><div class="nums"></div></div>
      <span class="btn btn-pan" data-i18n="home.subi.go"></span>
    </div>
  </a>
</div></section>

<section class="duo"><div class="wrap duo-grid">
  <div class="reveal" id="event-col">
    <h2 data-i18n-html="home.events.h"></h2>
    <div id="next-event" class="next-event"></div>
    <a class="btn btn-ghost" href="events.html" data-i18n="home.events.all"></a>
  </div>
  <div class="reveal">
    <h2 data-i18n-html="home.shop.h"></h2>
    <p class="sub" data-i18n="home.shop.sub"></p>
    <div id="shop-strip" class="shop-strip"></div>
    <a class="btn btn-pan" href="shop.html" data-i18n="home.shop.go"></a>
  </div>
</div></section>

<section class="partners-band" data-bg="meet"><div class="wrap duo-grid">
  <div class="reveal"><h2 data-i18n-html="home.partners.h"></h2></div>
  <div class="reveal">
    <p class="sub" data-i18n="home.partners.sub"></p>
    <div id="logo-strip" class="logo-strip"></div>
    <a class="btn btn-salt" href="partners.html" data-i18n="home.partners.go"></a>
  </div>
</div></section>

<section class="submit-band"><div class="wrap">
  <h2 class="reveal" data-i18n-html="home.submit.h"></h2>
  <a class="btn btn-pan reveal" href="submit.html" data-i18n="home.submit.go"></a>
</div></section>

<div data-shell="signup"></div>
<div data-shell="footer"></div>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n/home.js"></script>
<script src="data/videos.js"></script>
<script src="data/cars.js"></script>
<script src="data/events.js"></script>
<script src="data/products.js"></script>
<script src="data/partners.js"></script>
<script src="data/images.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/car.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
