<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Salt Road Cinema</title>
<meta name="description" content="Stickers, tees and a cap from Salt Road Cinema. Pickup in Kralendijk or shipping on request.">
<meta name="robots" content="noindex">
<link href="fonts/site-fonts.css" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body data-page="shop">
<div data-shell="nav"></div>

<header class="shop-hero"><div class="wrap sh-grid">
  <div class="sh-copy">
    <h1 data-i18n-html="shop.h1"></h1>
    <p class="sub" data-i18n-html="shop.sub2"></p>
    <a class="sh-fund" href="subi.html">
      <span class="sh-fund-t" data-i18n-html="shop.fund"></span>
      <span class="sh-bar"><i id="sh-bar"></i></span>
      <span class="sh-fund-n" id="sh-fund-n"></span>
    </a>
    <ul class="sh-facts">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg><span data-i18n="shop.fact.pickup"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg><span data-i18n="shop.fact.ship"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg><span data-i18n="shop.fact.pay"></span></li>
    </ul>
  </div>
  <a class="sh-feature cut" id="sh-feature" href="#tee-logo-black"></a>
</div></header>

<main>
  <section class="shop"><div class="wrap">
    <div class="shop-bar">
      <div class="chips" id="shop-chips" role="tablist"></div>
      <span class="shop-count" id="shop-count"></span>
    </div>
    <div id="shop-grid" class="pgrid"></div>
  </div></section>
</main>

<button class="cart-fab" id="cart-open" type="button" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19" r="1.6" fill="currentColor"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/></svg>
  <span data-i18n="shop.cart"></span>
  <b id="cart-count">0</b>
</button>

<dialog id="cart" class="cart" aria-labelledby="cart-title">
  <div class="cart-head">
    <h3 id="cart-title" data-i18n="shop.cart"></h3>
    <button class="btn btn-ghost btn-sm" id="cart-close" type="button" data-i18n="shop.close"></button>
  </div>
  <div id="cart-lines" class="cart-lines"></div>
  <form id="cart-form" class="cart-form" novalidate>
    <div class="cart-total"><span data-i18n="shop.total"></span><b id="cart-total">$0</b></div>
    <fieldset class="fulfil">
      <legend data-i18n="shop.fulfil"></legend>
      <label class="opt"><input type="radio" name="fulfil" value="pickup" checked><span data-i18n="shop.pickup"></span></label>
      <label class="opt"><input type="radio" name="fulfil" value="ship"><span data-i18n="shop.ship"></span></label>
    </fieldset>
    <label>
      <span data-i18n="shop.name"></span>
      <input name="name" autocomplete="name" required>
    </label>
    <p class="cart-err" id="cart-err" hidden data-i18n="shop.name.err"></p>
    <a class="btn btn-pan" id="cart-go" href="#" target="_blank" rel="noopener" data-i18n="shop.checkout"></a>
    <p class="cart-fine" data-i18n="shop.fine"></p>
  </form>
</dialog>

<div data-shell="signup"></div><div data-shell="footer"></div>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n/shop.js"></script>
<script src="data/products.js"></script>
<script src="data/images.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/shop.js"></script>
</body>
</html>
