<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save the Subi | Salt Road Cinema</title>
<meta name="description" content="Help bring a 2003 Subaru Impreza WRX back to life on Bonaire. Send a part, fund a part, or put your brand on the car.">
<meta name="robots" content="noindex">
<link href="fonts/archivo-jetbrains-mono-0679c9.css" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/css/subi.css">
</head>
<body data-page="garage">
<div data-shell="nav"></div>

<header class="subi-hero"><div class="wrap">
  <a class="back" href="garage.html" data-i18n="subi.back"></a>
  <div class="grid">
    <div><h1 data-i18n-html="subi.h1"></h1></div>
    <div>
      <p class="sub lead" data-i18n="subi.lead"></p>
      <div class="meter"><div class="bar"><div class="fill"></div></div><div class="nums"></div></div>
      <div class="spec">
        <div><span data-i18n="subi.spec.car"></span><b><span id="spec-year"></span> <span data-i18n="subi.spec.carv"></span></b></div>
        <div><span data-i18n="subi.spec.engine"></span><b id="spec-engine"></b></div>
        <!-- TODO confirm with Rudo: is it really the head gasket? -->
        <div><span data-i18n="subi.spec.problem"></span><b data-i18n="subi.spec.problemv"></b></div>
        <div><span data-i18n="subi.spec.left"></span><b id="parts-left">–</b></div>
      </div>
    </div>
  </div>
</div></header>

<section class="ba-sec"><div class="wrap">
  <div class="head reveal"><h2 data-i18n-html="subi.ba.title"></h2></div>
  <div class="ba">
    <figure class="ba-frame reveal" id="ba-now"><div class="ba-media"></div><figcaption data-i18n="subi.ba.now"></figcaption></figure>
    <figure class="ba-frame reveal" id="ba-goal"><div class="ba-media"></div><figcaption data-i18n="subi.ba.goal"></figcaption></figure>
  </div>
</div></section>

<section><div class="wrap">
  <div class="head reveal"><h2 data-i18n-html="subi.ways.title"></h2></div>
  <div class="ways">
    <a class="way reveal" href="#parts-sec"><h3 data-i18n="subi.way1.h"></h3><p data-i18n="subi.way1.p"></p><span class="go" data-i18n="subi.way1.go"></span></a>
    <a class="way reveal" href="#sponsor"><h3 data-i18n="subi.way2.h"></h3><p data-i18n="subi.way2.p"></p><span class="go" data-i18n="subi.way2.go"></span></a>
    <a class="way reveal" href="#chip"><h3 data-i18n="subi.way3.h"></h3><p data-i18n="subi.way3.p"></p><span class="go" data-i18n="subi.way3.go"></span></a>
  </div>
</div></section>

<section id="parts-sec"><div class="wrap">
  <div class="head reveal">
    <div><h2 data-i18n-html="subi.parts.title"></h2><p class="sub" data-i18n="subi.parts.sub"></p></div>
  </div>
  <div id="filters" class="filters"></div>
  <div id="parts" class="parts"></div>
</div></section>

<section id="sponsor"><div class="wrap">
  <div class="head reveal">
    <div><h2 data-i18n-html="subi.spot.title"></h2><p class="sub" data-i18n="subi.spot.sub"></p></div>
  </div>
  <div class="decal">
    <div class="car-frame reveal" data-car></div>
    <div>
      <div class="tiers reveal" id="tiers"></div>
      <div class="paybar reveal"><span id="pay-what" class="what-buys"></span><a id="pay-go" class="btn btn-pan" href="#" target="_blank" rel="noopener" hidden></a></div>
    </div>
  </div>
</div></section>

<section id="chip"><div class="wrap chipin">
  <div class="reveal"><h2 data-i18n-html="subi.chip.title"></h2><p class="sub" data-i18n="subi.chip.sub"></p></div>
  <div class="reveal">
    <div id="amounts" class="amounts"><button data-a="10">$10</button><button data-a="25">$25</button><button data-a="50">$50</button><button data-a="100">$100</button></div>
    <p id="what-buys" class="what-buys"></p>
    <p style="margin-top:22px"><a id="chip-go" class="btn btn-pan" href="#" target="_blank" rel="noopener"></a></p>
  </div>
</div></section>

<section id="talk"><div class="wrap chipin">
  <div class="reveal">
    <h2 data-i18n-html="subi.talk.title"></h2>
    <p class="sub" data-i18n="subi.talk.sub"></p>
    <h3 class="wall-h" data-i18n="subi.talk.wall"></h3>
    <div class="wall"><span class="empty" data-i18n="subi.talk.wall1"></span><span class="empty" data-i18n="subi.talk.wall2"></span></div>
  </div>
  <form id="sponsor-form" class="sponsor reveal">
    <label><span data-i18n="subi.form.name"></span><input name="name" required autocomplete="name"></label>
    <label><span data-i18n="subi.form.company"></span><input name="company" autocomplete="organization"></label>
    <label class="full"><span data-i18n="subi.form.email"></span><input name="email" type="email" required autocomplete="email"></label>
    <label class="full"><span data-i18n="subi.form.what"></span><select id="f-what" name="what"></select></label>
    <label class="full"><span data-i18n="subi.form.msg"></span><textarea name="msg" data-i18n-ph="subi.form.msg.ph"></textarea></label>
    <div class="full">
      <button class="btn btn-salt" type="submit" data-i18n="common.send"></button>
      <a class="btn btn-ghost" id="wa-link" href="#" target="_blank" rel="noopener" data-i18n="subi.form.wa"></a>
      <p class="form-ok" id="form-ok" hidden data-i18n="common.sent"></p>
      <p class="form-err" id="form-err" hidden data-i18n="subi.form.retry"></p>
    </div>
  </form>
</div></section>

<div data-shell="signup"></div>
<div data-shell="footer"></div>

<dialog id="ship">
  <h3 data-i18n="subi.ship.title"></h3>
  <p><span data-i18n="subi.ship.sending"></span> <b id="ship-part"></b></p>
  <pre id="ship-addr"></pre>
  <p class="ship-note" data-i18n="subi.ship.note"></p>
  <div class="row">
    <button id="ship-copy" class="btn btn-ghost btn-sm" data-i18n="subi.ship.copy"></button>
    <a id="ship-tell" class="btn btn-pan btn-sm" href="#" data-i18n="subi.ship.tell"></a>
    <button id="ship-close" class="btn btn-ghost btn-sm" data-i18n="subi.ship.close"></button>
  </div>
</dialog>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n/subi.js"></script>
<script src="data/cars.js"></script>
<script src="data/subi-parts.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/car.js"></script>
<script src="assets/subi.js"></script>
</body>
</html>
